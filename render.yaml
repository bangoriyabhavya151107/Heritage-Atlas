services:
  - type: web
    name: heritage-atlas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        value: "768"
      - key: AI_PROVIDER
        value: gemini
      - key: SEARCH_MIN_SIMILARITY
        value: "0.35"
      - key: CORS_ORIGINS
        sync: false
